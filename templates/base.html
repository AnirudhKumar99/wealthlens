<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Family Financial Lifecycle & Wealth Planning Dashboard — comprehensive wealth projection, goal tracking, inflation-adjusted compounding, and executive financial summaries." />
  <meta name="theme-color" content="#050d1e" />
  <title>{{ page_title }} | WealthLens</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

  <!-- Tailwind CSS CDN v3 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { sans: ['Inter', 'sans-serif'] },
        },
      },
    };
  </script>

  <!-- Chart.js CDN -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

  <!-- Custom stylesheet -->
  <link rel="stylesheet" href="/static/css/custom.css" />

  <!-- Alpine.js CDN (deferred — runs after DOM is fully parsed) -->
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.5/dist/cdn.min.js"></script>
</head>
<body class="dark min-h-screen">

  {% block content %}{% endblock %}

  <!-- Charts.js must be loaded AFTER page content so canvas elements exist,
       but BEFORE Alpine.js (which is deferred) so initCharts / updateCharts
       are available when the Alpine component initialises. -->
  <script src="/static/js/charts.js"></script>

</body>
</html>
